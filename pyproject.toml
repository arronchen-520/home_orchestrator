[project]
name = "home-orchestrator"
version = "0.1.0"
description = "A bilingual, LangGraph-powered shared family board."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-openai>=1.4.1",
    "langgraph>=1.2.10",
    "python-dotenv>=1.2.2",
    "python-dateutil>=2.9.0.post0",
    "python-multipart>=0.0.32",
    "tzdata>=2026.3",
    "uvicorn>=0.52.0",
]

[project.scripts]
home-orchestrator = "app:main"
