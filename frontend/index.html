<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="A bilingual home for family plans and notes">
    <meta name="theme-color" content="#fffaf2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Hearthbook">
    <title>Hearthbook</title>
    <link rel="apple-touch-icon" href="/static/assets/hearthbook-icon.png">
    <link rel="manifest" href="/static/manifest.webmanifest">
    <link rel="stylesheet" href="/static/styles.css?v=20260803-1">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#home" aria-label="Hearthbook">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Hearthbook</span>
      </a>
      <div class="top-actions">
        <button id="languageButton" class="icon-text" type="button" aria-label="Switch language">EN</button>
        <button id="settingsButton" class="icon-button" type="button" data-i18n-aria="settings" aria-label="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.56V21h-4v-.08A1.7 1.7 0 0 0 9 19.37a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.63 15 1.7 1.7 0 0 0 3.08 14H3v-4h.08A1.7 1.7 0 0 0 4.63 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.63a1.7 1.7 0 0 0 1-1.55V3h4v.08A1.7 1.7 0 0 0 15 4.63a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.37 9a1.7 1.7 0 0 0 1.55 1H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/></svg>
        </button>
      </div>
    </header>

    <main class="app-main">
      <section id="homeView" class="view active" data-view="home" aria-labelledby="homeTitle">
        <header class="welcome">
          <p id="todayDate" class="eyebrow"></p>
          <h1 id="homeTitle" data-i18n="homeTitle">今天有什么想记录的吗？</h1>
          <p data-i18n="homeSubtitle">记录、查询，或者聊聊。</p>
        </header>

        <section class="voice-card" aria-labelledby="voiceTitle">
          <h2 id="voiceTitle" class="sr-only" data-i18n="voiceTitle">家庭助手</h2>
          <button id="recordButton" class="voice-button" type="button" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12Z"/></svg>
            <span data-i18n="tapToTalk">按住说话</span>
          </button>
          <div class="input-options">
            <button id="textToggle" class="text-toggle" type="button" aria-expanded="false" aria-controls="messageForm" data-i18n="preferTyping">文字输入</button>
            <label class="image-toggle" for="imageInput">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9" r="1.5"/><path d="m4 18 5-5 3.5 3.5 2.5-2.5L20 19"/></svg>
              <span data-i18n="uploadImage">上传图片</span>
            </label>
          </div>
          <form id="messageForm" class="message-form" hidden>
            <label for="messageInput" class="sr-only" data-i18n="messageLabel">输入记录、问题或消息</label>
            <textarea id="messageInput" rows="2" maxlength="1000" required data-i18n-placeholder="messagePlaceholder" placeholder="例如：周六三点看牙，提醒妈妈"></textarea>
            <button class="send-button" type="submit" data-i18n-aria="send" aria-label="发送">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 17 8-17 8 3-8-3-8Zm3 8h14"/></svg>
            </button>
          </form>
          <input id="imageInput" type="file" accept="image/png,.png,image/jpeg,.jpg,.jpeg" hidden>
          <form id="imageForm" class="image-form" hidden>
            <p id="imageFileName" class="image-file-name" aria-live="polite"></p>
            <label for="imageText" class="sr-only" data-i18n="imageNoteLabel">补充说明（可选）</label>
            <textarea id="imageText" rows="2" maxlength="2000" data-i18n-placeholder="imageNotePlaceholder" placeholder="例如：帮我记到日历"></textarea>
            <div class="image-actions">
              <button id="cancelImage" class="quiet-button" type="button" data-i18n="cancel">取消</button>
              <button class="primary-button" type="submit" data-i18n="sendImage">发送截图</button>
            </div>
          </form>
        </section>

        <section id="conversation" class="conversation card" aria-labelledby="conversationTitle" aria-live="polite" hidden>
          <div class="section-title-row">
            <h2 id="conversationTitle" data-i18n="conversation">对话</h2>
            <button id="clearConversation" class="quiet-button" type="button" data-i18n="clear">清空</button>
          </div>
          <div id="messageList" class="message-list"></div>
          <section id="confirmation" class="confirmation" hidden>
            <div id="confirmationSummary"></div>
            <fieldset id="remindChoices">
              <legend data-i18n="remindWho">提醒谁</legend>
            </fieldset>
            <div id="preparationChoices"></div>
            <div class="button-row">
              <button id="cancelConfirmation" class="secondary-button" type="button" data-i18n="cancel">取消</button>
              <button id="confirmButton" class="primary-button" type="button" data-i18n="confirm">确认</button>
            </div>
          </section>
        </section>

        <section class="today-section" aria-labelledby="todayTitle">
          <div class="section-title-row">
            <div>
              <h2 id="todayTitle" data-i18n="todayTitle">今天</h2>
            </div>
            <button id="refreshToday" class="icon-button" type="button" data-i18n-aria="refresh" aria-label="刷新">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6v5h-5M4 18v-5h5"/><path d="M18.5 9A7 7 0 0 0 6.1 6.1L4 8m2 7a7 7 0 0 0 11.9 2.9L20 16"/></svg>
            </button>
          </div>
          <div id="todayItems" class="item-list" aria-live="polite"></div>
        </section>
      </section>

      <section id="calendarView" class="view" data-view="calendar" aria-labelledby="calendarTitle" hidden>
        <header class="page-heading calendar-heading">
          <div>
            <p class="eyebrow" data-i18n="plans">安排</p>
            <h1 id="calendarTitle" data-i18n="calendar">日历</h1>
          </div>
          <button id="calendarTodayButton" class="secondary-button calendar-today-button" type="button" data-i18n="today">今天</button>
        </header>
        <section class="calendar-surface" aria-labelledby="calendarMonthTitle">
          <div class="calendar-toolbar">
            <button id="previousMonth" class="icon-button" type="button" data-i18n-aria="previousMonth" aria-label="上个月">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <h2 id="calendarMonthTitle" aria-live="polite"></h2>
            <button id="nextMonth" class="icon-button" type="button" data-i18n-aria="nextMonth" aria-label="下个月">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
          <div class="calendar-filter" role="group" data-i18n-aria="calendarFilter" aria-label="筛选安排">
            <button class="calendar-filter-button" type="button" data-calendar-filter="all" data-i18n="filterAll">全部</button>
            <button class="calendar-filter-button" type="button" data-calendar-filter="mine" data-i18n="filterMine">我的</button>
          </div>
          <p class="calendar-density-help" data-i18n="calendarDensityHelp">色深表示当天安排数量</p>
          <div id="calendarWeekdays" class="calendar-weekdays" aria-hidden="true"></div>
          <div id="calendarGrid" class="calendar-grid" data-i18n-aria="calendar" aria-label="日历"></div>
        </section>
        <section id="calendarAgenda" class="calendar-agenda" aria-labelledby="agendaTitle" hidden>
          <div class="section-title-row">
            <h2 id="agendaTitle"></h2>
            <span id="agendaCount" class="agenda-count" hidden></span>
          </div>
          <div id="calendarItems" class="item-list" aria-live="polite"></div>
        </section>
      </section>

      <section id="notesView" class="view" data-view="notes" aria-labelledby="notesTitle" hidden>
        <header class="page-heading">
          <h1 id="notesTitle" data-i18n="taskSpace">待办与笔记</h1>
        </header>
        <section class="task-section" aria-labelledby="tasksTitle">
          <div class="task-section-header">
            <h2 id="tasksTitle" data-i18n="tasks">待办</h2>
            <div class="task-filter" role="group" data-i18n-aria="taskFilter" aria-label="筛选待办">
              <button class="calendar-filter-button" type="button" data-task-filter="all" data-i18n="filterAll">全部</button>
              <button class="calendar-filter-button" type="button" data-task-filter="mine" data-i18n="filterMine">我的</button>
            </div>
          </div>
          <section id="overdueSection" class="task-group" aria-labelledby="overdueTitle" hidden>
            <h3 id="overdueTitle" data-i18n="overdue">已过期</h3>
            <div id="overdueItems" class="item-list"></div>
          </section>
          <section id="upcomingSection" class="task-group" aria-labelledby="upcomingTitle" hidden>
            <h3 id="upcomingTitle" data-i18n="dueSoon">未来 7 天</h3>
            <div id="upcomingItems" class="item-list"></div>
          </section>
          <section id="unscheduledSection" class="task-group" aria-labelledby="unscheduledTitle" hidden>
            <h3 id="unscheduledTitle" data-i18n="unscheduled">未定时间</h3>
            <div id="unscheduledItems" class="item-list"></div>
          </section>
          <details id="moreTasks" class="more-tasks" hidden>
            <summary><span data-i18n="moreTasks">展开更多</span><span id="moreTasksCount" class="agenda-count"></span></summary>
            <div id="laterItems" class="item-list"></div>
          </details>
          <p id="emptyTasks" class="empty" data-i18n="emptyTasks" hidden>没有待办。</p>
        </section>
        <section class="notes-section" aria-labelledby="notesSectionTitle">
          <h2 id="notesSectionTitle" data-i18n="notes">笔记</h2>
          <p class="page-intro" data-i18n="notesHelp">家里常用的信息，放在这里。</p>
          <div id="notesItems" class="notes-grid" aria-live="polite"></div>
        </section>
      </section>
    </main>

    <nav class="bottom-tabs" aria-label="主要导航">
      <button class="bottom-tab active" type="button" data-tab="home" aria-current="page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span data-i18n="home">首页</span>
      </button>
      <button class="bottom-tab" type="button" data-tab="calendar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v14H3V6a2 2 0 0 1 2-2Zm2-2v4m10-4v4M3 9h18"/></svg>
        <span data-i18n="calendar">日历</span>
      </button>
      <button class="bottom-tab" type="button" data-tab="notes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14a2 2 0 0 1 2 2v16H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm3 5h8m-8 4h8m-8 4h5"/></svg>
        <span data-i18n="tasks">待办</span>
      </button>
    </nav>

    <dialog id="itemDialog" class="sheet">
      <form method="dialog" class="dialog-header">
        <div><span id="itemKind" class="badge"></span><h2 id="itemTitle"></h2></div>
        <div class="item-dialog-actions">
          <button id="editItemButton" class="quiet-button" type="button" data-i18n="edit">编辑</button>
          <button id="cancelItemEditButton" class="quiet-button" type="button" data-i18n="cancel" hidden>取消</button>
          <button class="icon-button" type="submit" data-i18n-aria="close" aria-label="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
      </form>
      <section id="itemOverview" class="item-overview">
        <div id="itemMeta" class="item-meta"></div>
        <div id="itemReminders" class="remind-line"></div>
        <section id="preparationSection" class="item-preparation" aria-labelledby="preparationTitle" hidden>
          <h3 id="preparationTitle" data-i18n="preparation">准备事项</h3>
          <p id="itemPreparation"></p>
        </section>
        <div id="itemViewActions" class="button-row">
          <button id="toggleDone" class="primary-button" type="button" data-i18n="markDone">标记完成</button>
        </div>
      </section>
      <form id="itemForm" class="item-form" hidden>
        <section class="editor-section">
          <h3 data-i18n="basicInfo">基本信息</h3>
          <label><span data-i18n="title">标题</span><input id="editTitle" maxlength="120" required></label>
          <label><span data-i18n="details">详情</span><textarea id="editDetails" rows="3" maxlength="2000"></textarea></label>
          <label id="editScopeField" hidden>
            <span data-i18n="editScope">修改范围</span>
            <select id="editScope">
              <option value="occurrence" data-i18n="thisOccurrence">只修改这一次</option>
              <option value="series" data-i18n="entireSeries">修改整个系列</option>
            </select>
          </label>
        </section>
        <section id="editScheduleSection" class="editor-section">
          <h3 data-i18n="schedule">时间安排</h3>
          <div id="editEventFields" class="editor-fields" hidden>
            <label class="checkbox-row"><input id="editAllDay" type="checkbox"><span data-i18n="allDay">全天</span></label>
            <label id="editStartDateField"><span data-i18n="date">日期</span><input id="editStartDate" type="date"></label>
            <label id="editStartAtField"><span data-i18n="starts">开始</span><input id="editStartAt" type="datetime-local"></label>
            <label id="editEndAtField"><span data-i18n="ends">结束</span><input id="editEndAt" type="datetime-local"></label>
            <label id="editRecurrenceField">
              <span data-i18n="recurrence">重复</span>
              <select id="editRecurrence">
                <option value="" data-i18n="noRecurrence">不重复</option>
                <option value="daily" data-i18n="daily">每天</option>
                <option value="weekly" data-i18n="weekly">每周</option>
                <option value="monthly" data-i18n="monthly">每月</option>
                <option value="monthly_last_day" data-i18n="monthlyLastDay">每月最后一天</option>
              </select>
            </label>
            <fieldset id="editWeekdaysField" class="weekday-picker" hidden>
              <legend data-i18n="repeatOn">重复日期</legend>
              <label><input type="checkbox" value="MO"><span data-i18n="weekdayMO">周一</span></label>
              <label><input type="checkbox" value="TU"><span data-i18n="weekdayTU">周二</span></label>
              <label><input type="checkbox" value="WE"><span data-i18n="weekdayWE">周三</span></label>
              <label><input type="checkbox" value="TH"><span data-i18n="weekdayTH">周四</span></label>
              <label><input type="checkbox" value="FR"><span data-i18n="weekdayFR">周五</span></label>
              <label><input type="checkbox" value="SA"><span data-i18n="weekdaySA">周六</span></label>
              <label><input type="checkbox" value="SU"><span data-i18n="weekdaySU">周日</span></label>
            </fieldset>
            <label id="editRecurrenceUntilField"><span data-i18n="recurrenceEnds">重复结束</span><input id="editRecurrenceUntil" type="date"></label>
          </div>
          <div id="editTaskFields" class="editor-fields" hidden>
            <label class="checkbox-row"><input id="editDueTimed" type="checkbox"><span data-i18n="specificTime">指定时间</span></label>
            <label id="editDueDateField"><span data-i18n="dueDate">截止日期</span><input id="editDueDate" type="date"></label>
            <label id="editDueAtField"><span data-i18n="due">截止</span><input id="editDueAt" type="datetime-local"></label>
          </div>
        </section>
        <details id="editReminderSettings" class="reminder-picker">
          <summary><span data-i18n="reminder">提醒</span><span id="editReminderSummary"></span></summary>
          <div class="reminder-settings-body">
            <label id="editReminderAtField"><span data-i18n="reminder">提醒</span><input id="editReminderAt" type="datetime-local"></label>
            <details id="editRemindMemberField" class="reminder-picker">
              <summary><span data-i18n="remindWho">提醒谁</span><span id="editRemindMemberSummary"></span></summary>
              <div id="editRemindMembers"></div>
            </details>
          </div>
        </details>
        <p id="itemFormError" class="form-error" role="alert" hidden></p>
        <details id="itemDangerActions" class="item-danger-actions">
          <summary data-i18n="moreActions">更多操作</summary>
          <button id="deleteItem" class="danger-button full-width" type="button" data-i18n="delete">删除</button>
        </details>
        <div class="item-form-actions">
          <button class="primary-button" type="submit" data-i18n="save">保存</button>
        </div>
      </form>
      <details id="followupsSection" class="followups">
        <summary><span data-i18n="followups">进展记录</span><span id="followupsCount" class="agenda-count"></span></summary>
        <div id="followupList"></div>
        <form id="followupForm" class="inline-form">
          <label for="followupInput" class="sr-only" data-i18n="addFollowup">添加进展</label>
          <input id="followupInput" maxlength="1000" required data-i18n-placeholder="followupPlaceholder" placeholder="记录最新进展…">
          <button class="primary-button" type="submit" data-i18n="add">添加</button>
        </form>
      </details>
    </dialog>

    <dialog id="settingsDialog" class="sheet small-sheet">
      <div class="dialog-header"><h2 data-i18n="settings">设置</h2><button id="settingsCloseButton" class="icon-button" type="button" data-i18n-aria="close" aria-label="关闭"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <section class="settings-current" aria-labelledby="currentHouseholdTitle">
        <h3 id="currentHouseholdTitle" data-i18n="currentHousehold">当前家庭</h3>
        <p id="currentHouseholdName" class="current-household-name" hidden></p>
        <label id="householdSwitcher" hidden><span data-i18n="switchHousehold">切换家庭</span><select id="householdSelect"></select></label>
      </section>
      <details class="settings-details" name="settings">
        <summary><span id="profileTitle" data-i18n="myProfile">我的资料</span><span id="profileSummary" class="settings-summary"></span></summary>
        <div class="settings-details-body">
        <form id="memberProfileForm" class="stack-form" hidden>
          <label><span data-i18n="yourName">你的名字</span><input id="memberName" maxlength="40" autocomplete="name" required></label>
          <label><span data-i18n="myRole">我的身份</span><input id="memberRole" maxlength="40" autocomplete="organization-title"></label>
          <button class="secondary-button" type="submit" data-i18n="saveProfile">保存资料</button>
        </form>
        </div>
      </details>
      <details class="settings-details" name="settings">
        <summary><span id="notificationTitle" data-i18n="notifications">通知</span><span id="notificationSummary" class="settings-summary"></span></summary>
        <div class="settings-details-body">
        <p data-i18n="notificationHelp">在提醒时间推送日程和待办，并在每天上午 9 点（本地时间）发送今日摘要。</p>
        <button id="notificationButton" class="secondary-button full-width" type="button" data-i18n="allowNotifications">允许通知</button>
        <p id="notificationStatus" class="settings-status" aria-live="polite"></p>
        </div>
      </details>
      <details class="settings-details" name="settings">
        <summary><span id="membersTitle" data-i18n="familyMembers">家庭成员</span><span id="membersSummary" class="settings-summary"></span></summary>
        <div class="settings-details-body">
        <div id="householdSummary"></div>
        </div>
      </details>
      <details class="settings-details" name="settings">
        <summary><span data-i18n="otherHouseholds">其他家庭</span></summary>
        <div class="settings-details-body">
          <form id="createAdditionalHouseholdForm" class="stack-form">
            <h3 data-i18n="createAnotherHousehold">创建新家庭</h3>
            <label><span data-i18n="householdName">家庭名称</span><input id="additionalHouseholdName" maxlength="80" required></label>
            <label><span data-i18n="yourName">你的名字</span><input id="additionalCreatorName" maxlength="40" autocomplete="name" required></label>
            <label><span data-i18n="memberRole">你的身份（可选）</span><input id="additionalCreatorRole" maxlength="40" autocomplete="organization-title"></label>
            <button class="secondary-button" type="submit" data-i18n="createHousehold">创建家庭</button>
          </form>
          <form id="joinAdditionalHouseholdForm" class="stack-form">
            <h3 data-i18n="joinAnotherHousehold">加入已有家庭</h3>
            <label><span data-i18n="inviteCode">家庭邀请码</span><input id="additionalInviteCode" maxlength="40" required autocomplete="one-time-code"></label>
            <label><span data-i18n="yourName">你的名字</span><input id="additionalJoinerName" maxlength="40" required autocomplete="name"></label>
            <label><span data-i18n="memberRole">你的身份（可选）</span><input id="additionalJoinerRole" maxlength="40" autocomplete="organization-title"></label>
            <button class="secondary-button" type="submit" data-i18n="joinHousehold">加入家庭</button>
          </form>
        </div>
      </details>
      <details class="settings-details account-settings" name="settings">
        <summary><span id="accountTitle" data-i18n="account">账户</span></summary>
        <div class="settings-details-body">
        <button id="leaveHouseholdButton" class="logout-button" type="button" data-i18n="leaveHousehold">退出这个家庭</button>
        <button id="logoutButton" class="logout-button" type="button" data-i18n="logout">退出登录</button>
        </div>
      </details>
    </dialog>

    <dialog id="authDialog" class="sheet small-sheet">
      <form id="authForm" class="stack-form">
        <h2 data-i18n="authTitle">登录 Hearthbook</h2>
        <label><span data-i18n="email">邮箱</span><input id="authEmail" type="email" maxlength="320" autocomplete="email" required></label>
        <label><span data-i18n="password">密码</span><input id="authPassword" type="password" minlength="8" maxlength="200" autocomplete="current-password" required></label>
        <p id="authError" class="form-error" role="alert" hidden></p>
        <button class="primary-button" type="submit" data-i18n="login">登录</button>
        <button id="signupButton" class="secondary-button" type="button" data-i18n="signup">创建账号</button>
      </form>
    </dialog>

    <dialog id="onboardingDialog" class="sheet small-sheet">
      <div class="dialog-header"><h2 data-i18n="householdSetup">设置家庭</h2></div>
      <form id="createHouseholdForm" class="stack-form">
        <label><span data-i18n="memberRole">Your role (optional)</span><input id="creatorRole" maxlength="40" autocomplete="organization-title"></label>
        <label><span data-i18n="householdName">家庭名称</span><input id="newHouseholdName" maxlength="80" required></label>
        <label><span data-i18n="yourName">你的名字</span><input id="creatorName" maxlength="40" required autocomplete="name"></label>
        <button class="primary-button" type="submit" data-i18n="createHousehold">创建家庭</button>
      </form>
      <p class="divider" data-i18n="orJoin">或者加入已有家庭</p>
      <form id="joinHouseholdForm" class="stack-form">
        <label><span data-i18n="inviteCode">家庭邀请码</span><input id="inviteCode" maxlength="40" required autocomplete="one-time-code"></label>
        <label><span data-i18n="yourName">你的名字</span><input id="joinerName" maxlength="40" required autocomplete="name"></label>
        <label><span data-i18n="memberRole">你的身份（可选）</span><input id="joinerRole" maxlength="40" autocomplete="organization-title"></label>
        <button class="secondary-button" type="submit" data-i18n="joinHousehold">加入家庭</button>
      </form>
      <p id="onboardingError" class="form-error" role="alert" hidden></p>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="/static/app.js?v=20260803-1" defer></script>
  </body>
</html>
