<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A bilingual shared family board">
    <title>Home Orchestrator</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="app-header">
      <a class="brand" href="/" aria-label="Home Orchestrator">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M3 11.5 12 4l9 7.5v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>
        </svg>
        <span>Home Orchestrator</span>
      </a>
      <div class="header-actions">
        <label class="identity">
          <span data-i18n="iAm">我是</span>
          <select id="actorSelect" data-i18n-aria="currentMember" aria-label="Current family member"></select>
        </label>
        <button id="membersButton" class="button secondary compact" type="button" data-i18n="family">
          家庭成员
        </button>
        <button id="languageButton" class="button ghost compact" type="button" data-i18n-aria="switchLanguage" aria-label="Switch language">
          EN
        </button>
      </div>
    </header>

    <main>
      <section class="composer card" aria-labelledby="pageTitle">
        <div>
          <p class="eyebrow" data-i18n="eyebrow">家庭共享板</p>
          <h1 id="pageTitle" data-i18n="heading">说出来，家里就安排好了。</h1>
          <p class="lede" data-i18n="subheading">AI 会把中文或英文整理成日程、待办或笔记。</p>
        </div>
        <form id="inputForm">
          <label for="textInput" data-i18n="inputLabel">要添加什么？</label>
          <textarea
            id="textInput"
            rows="3"
            maxlength="2000"
            required
            data-i18n-placeholder="inputPlaceholder"
            placeholder="例如：周六下午三点带孩子看牙医"
          ></textarea>
          <div class="composer-options">
            <label>
              <span data-i18n="optionalOwner">负责人（可选）</span>
              <select id="newOwnerSelect"></select>
            </label>
            <div class="composer-buttons">
              <button id="recordButton" class="button secondary" type="button">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12Z"/>
                </svg>
                <span data-i18n="record">语音</span>
              </button>
              <button id="submitButton" class="button primary" type="submit" data-i18n="add">
                添加
              </button>
            </div>
          </div>
        </form>
      </section>

      <nav class="tabs" role="tablist" data-i18n-aria="boardViews" aria-label="Board views">
        <button class="tab active" type="button" role="tab" aria-selected="true" data-view="board" data-i18n="board">
          共享板
        </button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-view="calendar" data-i18n="calendar">
          日历
        </button>
        <button class="tab" type="button" role="tab" aria-selected="false" data-view="notes" data-i18n="notes">
          笔记
        </button>
      </nav>

      <section id="boardView" class="view" role="tabpanel">
        <div class="board-grid">
          <section class="status-column unclaimed">
            <header>
              <h2 data-i18n="unclaimed">未认领</h2>
              <span id="unclaimedCount" class="count">0</span>
            </header>
            <div id="unclaimedItems" class="item-list"></div>
          </section>
          <section class="status-column claimed">
            <header>
              <h2 data-i18n="claimed">已认领</h2>
              <span id="claimedCount" class="count">0</span>
            </header>
            <div id="claimedItems" class="item-list"></div>
          </section>
          <section class="status-column done">
            <header>
              <h2 data-i18n="done">完成</h2>
              <span id="doneCount" class="count">0</span>
            </header>
            <div id="doneItems" class="item-list"></div>
          </section>
        </div>
      </section>

      <section id="calendarView" class="view" role="tabpanel" hidden>
        <div class="calendar-layout">
          <section class="calendar card">
            <header class="calendar-header">
              <button id="previousMonth" class="icon-button" type="button" data-i18n-aria="previousMonth" aria-label="Previous month">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
              </button>
              <h2 id="monthTitle"></h2>
              <button id="nextMonth" class="icon-button" type="button" data-i18n-aria="nextMonth" aria-label="Next month">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
              </button>
            </header>
            <div id="calendarGrid" class="calendar-grid"></div>
          </section>
          <aside class="agenda card">
            <h2 id="agendaTitle"></h2>
            <div id="agendaItems" class="item-list"></div>
          </aside>
        </div>
      </section>

      <section id="notesView" class="view" role="tabpanel" hidden>
        <div id="notesItems" class="notes-grid"></div>
      </section>
    </main>

    <dialog id="membersDialog">
      <form method="dialog" class="dialog-header">
        <h2 data-i18n="familyMembers">家庭成员</h2>
        <button class="icon-button" type="submit" data-i18n-aria="close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
      </form>
      <p data-i18n="memberHelp">先添加家庭成员。每个人使用前在右上角选择自己。</p>
      <ul id="memberList" class="member-list"></ul>
      <form id="memberForm" class="inline-form">
        <label class="sr-only" for="memberName" data-i18n="memberName">成员姓名</label>
        <input id="memberName" maxlength="40" required data-i18n-placeholder="memberName" placeholder="成员姓名">
        <button class="button primary" type="submit" data-i18n="addMember">添加成员</button>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="/static/app.js" defer></script>
  </body>
</html>
